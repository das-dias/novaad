[project]
name = "novaad"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dasdias", email = "das.dias6@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "bokeh>=3.9.2",
    "docopt>=0.6.2",
    "nbformat>=5.11.1",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pip>=25.3",
    "protobuf>=7.35.1",
    "pydantic>=2.12.5",
    "rich>=15.0.0",
    "scipy>=1.15.3",
    "toml>=0.10.2",
]

[project.scripts]
novaad = "novaad.cli:main"

[tool.novaad]
out_log_path = "./log"

[tool.novaad.nch]
lut_path = "./test/data/test_nch_lut_renamed.csv"
ref_width = 10e-6 # reference channel width

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/novaad", "src/schema"]

[dependency-groups]
dev = [
    "inspice>=1.7.0.7 ; python_full_version >= '3.12'",
    "ipykernel>=7.3.0",
    "nbconvert>=7.17.2",
    "pymoo>=0.6.2",
    "pytest>=9.2.0",
]
docs = [
    "zensical>=0.0.67",
]
