[project]
site_name = "novaad"
site_description = "LUT-based gm/id analog IC design: a Python API and CLI for transistor sizing"
site_author = "das-dias"
site_url = "https://das-dias.github.io/novaad/"
copyright = "Copyright &copy; das-dias. BSD 2-Clause License."
repo_url = "https://github.com/das-dias/novaad"
repo_name = "das-dias/novaad"
edit_uri = "edit/master/docs/"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    "installation.md",
    "quickstart.md",
  ] },
  { "User guide" = [
    "cli.md",
    "lut-extraction.md",
  ] },
  { "Examples" = [
    "examples/index.md",
    "examples/cs-amplifier.md",
    "examples/fd-amplifier.md",
    "examples/voltage-buffer.md",
    "examples/dt-fd-amplifier.md",
  ] },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
logo = "lucide/cpu"
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/das-dias/novaad"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/novaad/"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
